<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ice Servers</title>
<link rel="stylesheet" href="common.css">
<style>
.light { width: 12px; height: 12px; padding: 0; border: 0; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
.light svg { opacity: 0; }
.lights:hover .light svg { opacity: 1; }
.capsule:disabled { opacity: 0.45; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field > span { font-size: 12px; font-weight: 600; color: #56565B; letter-spacing: 0.02em; }
.field em { font-style: normal; font-weight: 500; color: #8E8E93; }
.field input { height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid rgba(60,60,67,0.18); background: rgba(255,255,255,0.8); font: inherit; font-size: 14px; color: #1D1D1F; outline: none; }
.field input:focus { border-color: #0066CC; box-shadow: 0 0 0 3px rgba(0,102,204,0.2); }
.field input:disabled { opacity: 0.6; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.shake { animation: shake 0.35s ease; }
</style>
</head>
<body>
<div style="position: fixed; inset: 0; padding: 10px; display: flex; gap: 10px; border-radius: 28px; background: rgba(244,247,251,0.66); border: 1px solid rgba(255,255,255,0.65); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9)">

<nav aria-label="Servers" style="width: 248px; flex-shrink: 0; box-sizing: border-box; padding: 16px 12px 12px; display: flex; flex-direction: column; gap: 6px; border-radius: 20px; background: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.75); box-shadow: 0 8px 24px rgba(20,40,80,0.08), inset 0 1px 0 rgba(255,255,255,0.95)">
<div class="lights" style="display: flex; gap: 8px; padding: 0 6px 18px">
<button class="light" data-cmd="close" aria-label="Close" style="background: #FF5F57"><svg width="6" height="6" viewBox="0 0 6 6" stroke="rgba(0,0,0,0.5)" stroke-width="1.2" stroke-linecap="round"><path d="M1 1l4 4M5 1L1 5"></path></svg></button>
<button class="light" data-cmd="minimize" aria-label="Minimize" style="background: #FEBC2E"><svg width="8" height="8" viewBox="0 0 8 8" stroke="rgba(0,0,0,0.5)" stroke-width="1.2" stroke-linecap="round"><path d="M1 4h6"></path></svg></button>
<button class="light" data-cmd="zoom" aria-label="Zoom" style="background: #28C840"><svg width="6" height="6" viewBox="0 0 6 6" fill="rgba(0,0,0,0.5)"><path d="M0 0h4L0 4zM6 6H2l4-4z"></path></svg></button>
</div>
<div style="padding: 0 10px 6px; font-size: 12px; font-weight: 600; color: #5E5E63; letter-spacing: 0.02em">Servers</div>
<div id="list" style="display: contents"></div>
<div style="flex-grow: 1"></div>
<button data-cmd="showAdd" aria-label="Add server" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border: 0; border-radius: 12px; background: transparent; font-size: 13px; font-weight: 500; color: #0066CC; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
Add Server
</button>
</nav>

<main style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 18px 22px 18px 14px; display: flex; flex-direction: column; gap: 16px">
<header id="head" style="display: flex; align-items: center; justify-content: space-between; gap: 16px"></header>
<div id="body" style="display: contents"></div>
<section id="upd" aria-label="Software updates" style="box-sizing: border-box; min-height: 92px; padding: 16px 18px; display: flex; align-items: center; gap: 16px; border-radius: 22px; background: rgba(255,255,255,0.72); border: 1px solid rgba(255,255,255,0.9); box-shadow: 0 6px 20px rgba(20,40,80,0.07), inset 0 1px 0 rgba(255,255,255,1)"></section>
</main>
</div>

<div id="sheet" style="position: fixed; inset: 0; display: none; align-items: center; justify-content: center; border-radius: 28px; background: rgba(20,40,80,0.18)">
<form id="addForm" autocomplete="off" style="width: 400px; padding: 24px; display: flex; flex-direction: column; gap: 20px; border-radius: 28px; background: rgba(246,248,252,0.96); border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 30px 70px rgba(8,28,60,0.32), inset 0 1px 0 rgba(255,255,255,1)">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em">Add Server</h2>
<p style="margin: 0; font-size: 13px; color: #56565B">Any Linux machine you can reach with SSH key login.</p>
</div>
<label class="field"><span>Name</span><input name="name" placeholder="homelab" spellcheck="false"></label>
<label class="field"><span>SSH</span><input name="ssh" placeholder="user@192.168.1.20" spellcheck="false"></label>
<label class="field"><span>MAC address <em>· optional, learned automatically</em></span><input name="mac" placeholder="aa:bb:cc:dd:ee:ff" spellcheck="false"></label>
<div id="addError" style="display: none; font-size: 13px; font-weight: 600; color: #B33000"></div>
<div style="display: flex; justify-content: flex-end; gap: 10px">
<button type="button" data-cmd="hideAdd" style="height: 44px; padding: 0 18px; border-radius: 22px; background: rgba(255,255,255,0.7); border: 1px solid rgba(60,60,67,0.18); font-size: 14px; font-weight: 600; color: #1D1D1F; cursor: pointer">Cancel</button>
<button type="submit" style="height: 44px; padding: 0 20px; border: 0; border-radius: 22px; background: #0066CC; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: 0 6px 16px rgba(0,102,204,0.3), inset 0 1px 0 rgba(255,255,255,0.35)">Add Server</button>
</div>
</form>
</div>

<div id="pwSheet" style="position: fixed; inset: 0; display: none; align-items: center; justify-content: center; border-radius: 28px; background: rgba(20,40,80,0.18)">
<form id="pwForm" autocomplete="off" style="width: 400px; padding: 24px; display: flex; flex-direction: column; gap: 20px; border-radius: 28px; background: rgba(246,248,252,0.96); border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 30px 70px rgba(8,28,60,0.32), inset 0 1px 0 rgba(255,255,255,1)">
<div style="display: flex; align-items: center; gap: 14px">
<div style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 13px; display: flex; align-items: center; justify-content: center; background: linear-gradient(160deg, #8E8CF5, #5E5CE6); box-shadow: inset 0 1px 0 rgba(255,255,255,0.45)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></div>
<div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
<h2 id="pwTitle" style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap"></h2>
<p id="pwBody" style="margin: 0; font-size: 13px; color: #56565B"></p>
</div>
</div>
<label class="field"><span>sudo password</span><input name="pw" type="password" spellcheck="false"></label>
<div id="pwError" role="alert" style="display: none; margin-top: -8px; font-size: 13px; font-weight: 600; color: #B33000"></div>
<label style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #1D1D1F; cursor: pointer"><input name="remember" type="checkbox" checked style="width: 18px; height: 18px; margin: 0; accent-color: #0066CC">Remember in Keychain</label>
<div style="display: flex; justify-content: flex-end; gap: 10px">
<button type="button" data-cmd="pwCancel" style="height: 44px; padding: 0 18px; border-radius: 22px; background: rgba(255,255,255,0.7); border: 1px solid rgba(60,60,67,0.18); font-size: 14px; font-weight: 600; color: #1D1D1F; cursor: pointer">Cancel</button>
<button id="pwGo" type="submit" style="min-width: 112px; height: 44px; padding: 0 20px; border: 0; border-radius: 22px; background: #0066CC; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: 0 6px 16px rgba(0,102,204,0.3), inset 0 1px 0 rgba(255,255,255,0.35)">Continue</button>
</div>
</form>
</div>

<script src="common.js"></script>
<script>
let S = { servers: [] }, sel = null, pendingName = null;

const CARD = 'box-sizing: border-box; height: 176px; padding: 16px 18px; border-radius: 22px; background: rgba(255,255,255,0.72); border: 1px solid rgba(255,255,255,0.9); box-shadow: 0 6px 20px rgba(20,40,80,0.07), inset 0 1px 0 rgba(255,255,255,1)';
const CARD_LABEL = 'display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #5E5E63';
const BIG = 'font-size: 30px; font-weight: 700; letter-spacing: -0.02em';
const UNIT = '<span style="font-size: 16px; font-weight: 600; color: #5E5E63">%</span>';
const CAPSULE = 'display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 22px; background: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.9); box-shadow: 0 4px 14px rgba(20,40,80,0.08), inset 0 1px 0 rgba(255,255,255,1); font-size: 13px; font-weight: 600; color: #1D1D1F; cursor: pointer;';
const BLUE = 'height: 44px; padding: 0 20px; border: 0; border-radius: 22px; background: #0066CC; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: 0 6px 16px rgba(0,102,204,0.3), inset 0 1px 0 rgba(255,255,255,0.35)';

function render(state) {
  if (state) S = state;
  if (state && state.select) sel = state.select;
  const list = S.servers;
  const added = pendingName && list.find((s) => s.name === pendingName);
  if (added) { sel = added.id; pendingName = null; }
  if (!list.some((s) => s.id === sel)) sel = list[0] ? list[0].id : null;
  const s = list.find((x) => x.id === sel);

  set($('list'), list.map(row).join(''));
  $('head').style.display = s ? 'flex' : 'none';
  $('upd').style.display = s ? 'flex' : 'none';
  set($('head'), s ? header(s) : '');
  set($('body'), !s ? empty() : LIVE.includes(s.phase) ? stats(s) : offline(s));
  set($('upd'), s ? updates(s) : '');
}

function row(r) {
  const on = r.id === sel;
  const sub = r.phase === 'online' ? 'Online · up ' + uptime(r.uptime) : LABELS[r.phase];
  return `<button aria-label="Show ${esc(r.name)}" data-cmd="select" data-id="${r.id}" data-menu="${r.id}" style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 8px 10px; border-radius: 14px; text-align: left; cursor: pointer; border: 1px solid ${on ? 'rgba(255,255,255,0.95)' : 'transparent'}; background: ${on ? 'rgba(255,255,255,0.88)' : 'transparent'}; box-shadow: ${on ? '0 4px 14px rgba(20,40,80,0.10)' : 'none'};">
<span style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 11px; display: flex; align-items: center; justify-content: center; background: linear-gradient(160deg, #5AC8FA, #0A64D6); box-shadow: inset 0 1px 0 rgba(255,255,255,0.5)">${ICON.server}</span>
<span style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 0">
<span style="font-size: 14px; font-weight: 600; color: #1D1D1F; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">${esc(r.name)}</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #5E5E63"><span style="width: 8px; height: 8px; border-radius: 4px; flex-shrink: 0; background: ${colorsFor(r.phase)[2]}"></span>${sub}</span>
</span>
</button>`;
}

function header(s) {
  const c = colorsFor(s.phase);
  const busy = BUSY.includes(s.phase);
  const on = s.phase !== 'off' && s.phase !== 'stopping';
  const cant = s.phase !== 'online' ? 'disabled' : '';
  return `<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
<h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">${esc(s.name)}</h1>
<div style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #5E5E63">
<span style="display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 12px; font-size: 12px; font-weight: 600; color: ${c[0]}; background: ${c[1]}">${busy ? ICON.spin : `<span style="width: 7px; height: 7px; border-radius: 4px; background: ${c[2]}"></span>`}${LABELS[s.phase]}</span>
<span>${s.phase === 'online' ? 'Up ' + uptime(s.uptime) : ''}</span>
</div>
</div>
<div style="display: flex; align-items: center; gap: 12px">
<button class="capsule" data-cmd="restart" ${cant} aria-label="Restart server" style="${CAPSULE}">${ICON.restart(16, 2)}Restart</button>
<div style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 8px 0 16px; border-radius: 22px; background: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.9); box-shadow: 0 4px 14px rgba(20,40,80,0.08), inset 0 1px 0 rgba(255,255,255,1)">
${ICON.power(16, '#1D1D1F', 2)}
<span style="font-size: 13px; font-weight: 600">Power</span>
<button data-cmd="power" aria-label="Server power" aria-pressed="${on}" ${busy ? 'disabled' : ''} style="position: relative; width: 52px; height: 30px; flex-shrink: 0; padding: 0; border: 0; border-radius: 15px; cursor: pointer; transition: background 0.2s; background: ${on ? '#248A3D' : 'rgba(120,120,128,0.36)'}${busy ? '; opacity: 0.6' : ''}">
<span style="position: absolute; top: 2px; left: ${on ? '24px' : '2px'}; width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,0.22); transition: left 0.2s"></span>
</button>
</div>
</div>`;
}

function stats(s) {
  const cpu = pts(s.cpu, 100), nm = netMax(s);
  const mem = last(s.mem), disk = s.disk;
  return `<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">

<section aria-label="CPU" style="${CARD}; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="${CARD_LABEL}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A64D6" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"></rect><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"></path></svg>CPU</div>
<div style="${BIG}">${Math.round(last(s.cpu))}${UNIT}</div>
</div>
<svg viewBox="0 0 240 56" preserveAspectRatio="none" style="width: 100%; height: 80px; display: block" aria-hidden="true">
<polygon points="${cpu} 240,56 0,56" fill="rgba(10,132,255,0.14)"></polygon>
<polyline points="${cpu}" fill="none" stroke="#0A84FF" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"></polyline>
</svg>
<div style="font-size: 12px; color: #5E5E63">Last 48 seconds</div>
</section>

<section aria-label="Memory" style="${CARD}; display: flex; align-items: center; gap: 22px">
<div style="position: relative; width: 112px; height: 112px; flex-shrink: 0">
<svg width="112" height="112" viewBox="0 0 100 100" aria-hidden="true" style="transform: rotate(-90deg)">
<circle cx="50" cy="50" r="38" fill="none" stroke="rgba(120,120,128,0.18)" stroke-width="11"></circle>
<circle cx="50" cy="50" r="38" fill="none" stroke="#5E5CE6" stroke-width="11" stroke-linecap="round" stroke-dasharray="${(mem / 100 * RING).toFixed(1)} ${RING.toFixed(1)}"></circle>
</svg>
<div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700">${Math.round(mem)}%</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="${CARD_LABEL}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E5CE6" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="7" width="18" height="10" rx="2"></rect><path d="M7 7v10M11 7v10M15 7v10M7 20v-3M17 20v-3"></path></svg>Memory</div>
<div style="font-size: 26px; font-weight: 700; letter-spacing: -0.02em">${s.memUsed.toFixed(1)} GB</div>
<div style="font-size: 13px; color: #5E5E63">of ${Math.ceil(s.memTotal)} GB used</div>
</div>
</section>

<section aria-label="Network" style="${CARD}; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="${CARD_LABEL}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A64D6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"></path></svg>Network</div>
<div style="display: flex; gap: 16px; font-size: 13px">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #0A84FF"></span><span style="color: #5E5E63">In</span> <strong style="font-weight: 700">${last(s.down).toFixed(1)} MB/s</strong></span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #FF9F0A"></span><span style="color: #5E5E63">Out</span> <strong style="font-weight: 700">${last(s.up).toFixed(1)} MB/s</strong></span>
</div>
</div>
<svg viewBox="0 0 240 56" preserveAspectRatio="none" style="width: 100%; height: 80px; display: block" aria-hidden="true">
<polyline points="${pts(s.down, nm)}" fill="none" stroke="#0A84FF" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"></polyline>
<polyline points="${pts(s.up, nm)}" fill="none" stroke="#FF9F0A" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"></polyline>
</svg>
<div style="font-size: 12px; color: #5E5E63">MB/s · last 48 seconds</div>
</section>

<section aria-label="Disk" style="${CARD}; display: flex; flex-direction: column; justify-content: space-between">
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="${CARD_LABEL}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#248A3D" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><ellipse cx="12" cy="6" rx="8" ry="3"></ellipse><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"></path></svg>Disk</div>
<div style="${BIG}">${Math.round(disk)}${UNIT}</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="height: 14px; border-radius: 7px; background: rgba(120,120,128,0.18); overflow: hidden">
<div style="height: 100%; border-radius: 7px; background: ${disk > 80 ? '#FF9F0A' : '#34C759'}; width: ${disk}%"></div>
</div>
<div style="display: flex; justify-content: space-between; font-size: 13px">
<span><strong style="font-weight: 700">${size(s.diskUsed)}</strong> <span style="color: #5E5E63">of ${size(s.diskTotal)}</span></span>
<span style="color: #5E5E63">${size(s.diskFree)} free</span>
</div>
</div>
</section>

</div>`;
}

const PANEL = 'box-sizing: border-box; height: 366px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; border-radius: 22px; background: rgba(255,255,255,0.55); border: 1px solid rgba(255,255,255,0.85); text-align: center';
const panelIcon = (svg) => `<div style="width: 64px; height: 64px; border-radius: 32px; display: flex; align-items: center; justify-content: center; background: rgba(120,120,128,0.16)">${svg}</div>`;

function offline(s) {
  const off = s.phase === 'off';
  const body = !off ? 'Stats will be back as soon as the server responds.'
    : s.hasMac ? 'Turn it on to see live CPU, memory, network and disk stats.'
    : 'It can be turned on with Wake-on-LAN once the app has seen it online, or after you add its MAC address.';
  return `<div style="${PANEL}">
${panelIcon(ICON.power(30, '#5E5E63', 2))}
<div style="font-size: 20px; font-weight: 700">${off ? esc(s.name) + ' is off' : LABELS[s.phase]}</div>
<div style="font-size: 14px; color: #5E5E63; max-width: 340px">${body}</div>
${off && s.hasMac ? `<button data-cmd="power" style="height: 44px; padding: 0 22px; border: 0; border-radius: 22px; background: #0066CC; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: 0 6px 16px rgba(0,102,204,0.35), inset 0 1px 0 rgba(255,255,255,0.35)">Turn On</button>` : ''}
</div>`;
}

function empty() {
  return `<div style="${PANEL}">
${panelIcon(ICON.server.replace('#FFFFFF', '#5E5E63').replace('20" height="20"', '30" height="30"'))}
<div style="font-size: 20px; font-weight: 700">No servers yet</div>
<div style="font-size: 14px; color: #5E5E63; max-width: 340px">Add a machine you can reach over SSH to see its stats and control it from here.</div>
<button data-cmd="showAdd" style="${BLUE}">Add Server</button>
</div>`;
}

function updates(s) {
  const cant = s.phase !== 'online' ? 'disabled' : '';
  let title, sub;
  if (s.phase === 'updating') { title = `Installing ${s.updates} updates…`; sub = s.progress + '% complete'; }
  else if (s.phase === 'checking') { title = 'Checking for updates…'; sub = 'Contacting package sources'; }
  else if (s.updates == null) { title = 'Software updates'; sub = 'Not checked yet'; }
  else if (s.updates > 0) { title = `${s.updates} update${s.updates === 1 ? '' : 's'} available`; sub = 'Last checked ' + ago(s.checkedAgo); }
  else { title = 'Software is up to date'; sub = 'Last checked ' + ago(s.checkedAgo); }
  const idle = s.phase !== 'updating' && s.phase !== 'checking';
  return `<div style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 13px; display: flex; align-items: center; justify-content: center; background: linear-gradient(160deg, #8E8CF5, #5E5CE6); box-shadow: inset 0 1px 0 rgba(255,255,255,0.45)">${ICON.download(22, 2, '#FFFFFF')}</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0">
<div style="font-size: 15px; font-weight: 600">${title}</div>
${s.phase === 'updating' ? `<div style="height: 8px; border-radius: 4px; background: rgba(120,120,128,0.18); overflow: hidden"><div style="height: 100%; border-radius: 4px; background: #5E5CE6; transition: width 0.3s; width: ${s.progress}%"></div></div>` : ''}
<div style="font-size: 13px; color: #5E5E63">${sub}</div>
</div>
${idle && s.updates > 0 ? `<button data-cmd="install" ${cant} style="${BLUE}">Update Now</button>` : ''}
${idle && !(s.updates > 0) ? `<button class="capsule" data-cmd="check" ${cant} style="${CAPSULE}">${s.updates == null ? 'Check Now' : 'Check Again'}</button>` : ''}`;
}

function showAdd() {
  $('addForm').reset();
  $('addError').style.display = 'none';
  $('sheet').style.display = 'flex';
  $('addForm').name.focus();
}

function hideAdd() { $('sheet').style.display = 'none'; }

$('addForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const f = e.target, v = (k) => f[k].value.trim();
  const error = !v('name') ? 'Give the server a name.'
    : S.servers.some((s) => s.name === v('name')) ? 'There is already a server with that name.'
    : !v('ssh') ? 'Enter how to reach it over SSH, like user@192.168.1.20.'
    : v('mac') && !/^([0-9a-f]{2}[:-]){5}[0-9a-f]{2}$/i.test(v('mac')) ? 'A MAC address looks like aa:bb:cc:dd:ee:ff.'
    : '';
  if (error) {
    $('addError').textContent = error;
    $('addError').style.display = 'block';
    return;
  }
  pendingName = v('name');
  post({ cmd: 'add', name: v('name'), ssh: v('ssh'), mac: v('mac') });
  hideAdd();
});

// sudo password sheet. Swift shows it with askPassword() and closes it with hidePassword().
let pwFor = null;

function askPassword(o) {
  const f = $('pwForm');
  if (pwFor !== o.id) {
    f.reset();
    $('pwTitle').textContent = 'Password for ' + o.name;
    $('pwBody').textContent = `Restarting, shutting down and updating ${o.name} need the sudo password for ${o.user}.`;
  }
  pwFor = o.id;
  pwBusy(false);
  $('pwError').textContent = o.error || '';
  $('pwError').style.display = o.error ? 'block' : 'none';
  $('pwSheet').style.display = 'flex';
  if (o.error) {
    f.pw.value = '';
    f.classList.remove('shake');
    void f.offsetWidth;
    f.classList.add('shake');
  }
  f.pw.focus();
}

function hidePassword() {
  pwFor = null;
  $('pwSheet').style.display = 'none';
}

function pwBusy(busy) {
  const f = $('pwForm');
  f.pw.disabled = busy;
  $('pwGo').disabled = busy;
  $('pwGo').textContent = busy ? 'Checking…' : 'Continue';
}

$('pwForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const f = e.target;
  if (!f.pw.value) return f.pw.focus();
  pwBusy(true);
  post({ cmd: 'password', id: pwFor, value: f.pw.value, remember: f.remember.checked });
});

addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (pwFor) post({ cmd: 'passwordCancel' });
  else hideAdd();
});

function act(d) {
  if (d.cmd === 'select') { sel = d.id; render(); }
  else if (d.cmd === 'showAdd') showAdd();
  else if (d.cmd === 'hideAdd') hideAdd();
  else if (d.cmd === 'pwCancel') post({ cmd: 'passwordCancel' });
  else post({ cmd: d.cmd, id: sel });
}
</script>
</body>
</html>
