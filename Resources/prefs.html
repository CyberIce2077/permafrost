<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<link rel="stylesheet" href="common.css">
<style>
.light { width: 12px; height: 12px; padding: 0; border: 0; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
.light svg { opacity: 0; }
.lights:hover .light svg { opacity: 1; }
</style>
</head>
<body>
<div style="position: fixed; inset: 0; padding: 10px; display: flex; gap: 10px; border-radius: 28px; background: rgba(244,247,251,0.66); border: 1px solid rgba(255,255,255,0.65); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9)">

<nav aria-label="Settings" style="width: 248px; flex-shrink: 0; box-sizing: border-box; padding: 16px 12px; display: flex; flex-direction: column; gap: 6px; border-radius: 20px; background: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.75)">
<div class="lights" style="display: flex; gap: 8px; padding: 0 6px 18px">
<button class="light" data-cmd="close" aria-label="Close" style="background: #FF5F57"><svg width="6" height="6" viewBox="0 0 6 6" stroke="rgba(0,0,0,0.5)" stroke-width="1.2" stroke-linecap="round"><path d="M1 1l4 4M5 1L1 5"></path></svg></button>
<button class="light" data-cmd="minimize" aria-label="Minimize" style="background: #FEBC2E"><svg width="8" height="8" viewBox="0 0 8 8" stroke="rgba(0,0,0,0.5)" stroke-width="1.2" stroke-linecap="round"><path d="M1 4h6"></path></svg></button>
<button class="light" aria-label="Zoom" disabled style="background: #28C840"></button>
</div>
<div style="padding: 0 10px 6px; font-size: 12px; font-weight: 600; color: #5E5E63">Settings</div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 10px; border-radius: 14px; background: rgba(255,255,255,0.88)">
<span style="width: 28px; height: 28px; border-radius: 9px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: linear-gradient(160deg, #8E8CF5, #5E5CE6)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"></circle><path d="M10.8 12.2L20 3M16 7l3 3M14 9l2 2"></path></svg></span>
<span style="font-size: 14px; font-weight: 600">Passwords</span>
</div>
<button data-cmd="showWidgets" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 10px; border: 0; border-radius: 14px; background: transparent; text-align: left; cursor: pointer; color: #1D1D1F">
<span style="width: 28px; height: 28px; border-radius: 9px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: linear-gradient(160deg, #C7C7CC, #8E8E93)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"></rect><rect x="13" y="3" width="8" height="8" rx="2"></rect><rect x="3" y="13" width="8" height="8" rx="2"></rect><rect x="13" y="13" width="8" height="8" rx="2"></rect></svg></span>
<span style="font-size: 14px; font-weight: 600">Widgets</span>
</button>
</nav>

<main style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 18px 22px 18px 14px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em">Passwords</h1>
<p style="margin: 0; font-size: 13px; color: #56565B">Sudo passwords are kept in your macOS Keychain on this Mac only.</p>
</div>
<div id="rows" style="display: flex; flex-direction: column; border-radius: 20px; background: rgba(255,255,255,0.75); border: 1px solid rgba(255,255,255,0.9); overflow: hidden"></div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-radius: 20px; background: rgba(255,255,255,0.75); border: 1px solid rgba(255,255,255,0.9)">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">Require Touch ID</span><span style="font-size: 12px; color: #56565B">Confirm with your fingerprint before a saved password is used.</span></div>
<span id="touch" style="display: contents"></span>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-radius: 20px; background: rgba(255,255,255,0.75); border: 1px solid rgba(255,255,255,0.9)">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">Forget all passwords</span><span style="font-size: 12px; color: #56565B">Removes every saved sudo password from the Keychain.</span></div>
<button data-cmd="forgetAll" style="height: 36px; padding: 0 16px; border-radius: 18px; border: 1px solid rgba(215,0,21,0.3); background: #FFFFFF; font-size: 13px; font-weight: 600; color: #C4000F; cursor: pointer">Forget All</button>
</div>
</div>
</main>
</div>

<script src="common.js"></script>
<script>
let S = { servers: [] };

function render(state) {
  if (state) S = state;
  set($('rows'), S.servers.map((s, i) => {
    const note = s.sudo === 'nopass' ? 'Passwordless sudo' : s.saved ? 'Saved in Keychain' + (S.touchID ? ' · Touch ID required' : '') : 'Not saved · asks when needed';
    return `<div style="display: flex; align-items: center; gap: 14px; padding: 12px 16px;${i > 0 ? ' border-top: 1px solid rgba(60,60,67,0.1);' : ''}">
<span style="width: 36px; height: 36px; border-radius: 11px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: linear-gradient(160deg, #5AC8FA, #0A64D6)">${ICON.server}</span>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-size: 14px; font-weight: 600">${esc(s.name)} <span style="font-weight: 400; color: #56565B">· ${esc(s.user)}</span></span>
<span style="font-size: 12px; font-weight: 600; color: ${s.saved ? '#1E7A34' : '#56565B'}">${note}</span>
</div>
${s.sudo === 'nopass' ? '' : `<button data-cmd="${s.saved ? 'forget' : 'savePassword'}" data-id="${s.id}" style="height: 36px; padding: 0 16px; border-radius: 18px; border: 1px solid ${s.saved ? 'rgba(215,0,21,0.3)' : 'rgba(60,60,67,0.18)'}; background: #FFFFFF; font-size: 13px; font-weight: 600; cursor: pointer; color: ${s.saved ? '#C4000F' : '#0066CC'}">${s.saved ? 'Forget' : 'Save Password…'}</button>`}
</div>`;
  }).join('') || `<div style="padding: 16px; font-size: 13px; color: #56565B">No servers yet.</div>`);
  set($('touch'), toggle(!!S.touchID, 'touchID', 'Require Touch ID'));
}

function act(d) {
  if (sheetAct(d)) return;
  if (d.cmd === 'touchID') return post({ cmd: 'touchID', on: !S.touchID });
  post({ cmd: d.cmd, id: d.id });
}
</script>
</body>
</html>
